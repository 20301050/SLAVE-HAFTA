<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement - SLAVE HAFTA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bordeaux-deep: #8B0000;
            --bordeaux-dark: #6B0000;
            --bordeaux-darker: #5a0000;
            --white: #FFFFFF;
            --gold: #C9A84C;
            --gold-light: #D4AF37;
            --cream: #F5F0E8;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: #7a0000;
            color: var(--white);
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--bordeaux-darker);
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(201, 168, 76, 0.2);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--white);
        }

        .nav-links {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .nav-links a {
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--white);
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
        }

        .cart-icon span {
            font-size: 20px;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--gold);
            color: var(--bordeaux-deep);
            font-size: 11px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-link {
            margin-top: 120px;
            padding: 0 60px 40px;
            text-align: center;
        }

        .back-link a {
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold);
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: var(--gold-light);
        }

        .page-title {
            text-align: center;
            padding: 0 60px 40px;
        }

        .page-title h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(28px, 4vw, 48px);
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--white);
            margin-bottom: 15px;
        }

        .page-title .divider {
            width: 80px;
            height: 1px;
            background: var(--gold);
            margin: 0 auto;
        }

        .payment-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 60px 100px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-family: 'Lato', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(201, 168, 76, 0.3);
            color: var(--white);
            font-family: 'Lato', sans-serif;
            font-size: 14px;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 18px;
            background: var(--white);
            color: var(--bordeaux-deep);
            font-family: 'Lato', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
        }

        .btn-submit:hover {
            background: var(--cream);
        }

        .payment-logos {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(201, 168, 76, 0.2);
        }

        .payment-logos img {
            height: 30px;
            opacity: 0.8;
        }

        .secure-badge {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }

        .footer {
            padding: 40px 60px;
            background: var(--bordeaux-darker);
            text-align: center;
            border-top: 1px solid rgba(201, 168, 76, 0.2);
        }

        .footer-logo {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--white);
            margin-bottom: 15px;
        }

        .footer-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 30px;
            }

            .nav-links {
                gap: 20px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .payment-container {
                padding: 0 30px 80px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">SLAVE HAFTA</div>
        <div class="nav-links">
            <a href="collection.html">COLLECTION</a>
            <a href="index.html#histoire">NOTRE HISTOIRE</a>
            <a href="index.html#attente">LISTE D'ATTENTE</a>
            <a href="index.html#contact">CONTACT</a>
            <a href="panier.html" class="cart-icon">
                <span>🛒</span>
                <span class="cart-count" id="cartCount">0</span>
            </a>
        </div>
    </nav>

    <div class="back-link">
        <a href="panier.html">← RETOUR AU PANIER</a>
    </div>

    <div class="page-title">
        <h1>PAIEMENT SÉCURISÉ 🔒</h1>
        <div class="divider"></div>
    </div>

    <div class="payment-container">
        <form id="paymentForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" name="prenom" placeholder="Prénom" required>
                </div>
                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" placeholder="Nom" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="votre@email.com" required>
            </div>

            <div class="form-group">
                <label for="adresse">Adresse</label>
                <input type="text" id="adresse" name="adresse" placeholder="Adresse complète" required>
            </div>

            <div class="form-group">
                <label for="carte">Numéro de carte</label>
                <input type="text" id="carte" name="carte" placeholder="1234 5678 9012 3456" maxlength="19" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="expiration">Date expiration</label>
                    <input type="text" id="expiration" name="expiration" placeholder="MM/AA" maxlength="5" required>
                </div>
                <div class="form-group">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="4" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">CONFIRMER ET PAYER →</button>
        </form>

        <div class="payment-logos">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/200px-Visa_Inc._logo.svg.png" alt="Visa">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/200px-Mastercard-logo.svg.png" alt="Mastercard">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/PayPal.svg/200px-PayPal.svg.png" alt="PayPal">
        </div>

        <p class="secure-badge">🔒 Paiement 100% sécurisé</p>
    </div>

    <footer class="footer">
        <div class="footer-logo">SLAVE HAFTA</div>
        <p class="footer-text">© 2024 Slave Hafta. Tous droits réservés.</p>
    </footer>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        document.getElementById('cartCount').textContent = cart.length;

        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Merci pour votre commande ! Nous vous contactons dans les 24h.');
            localStorage.removeItem('cart');
            setTimeout(function() {
                window.location.href = 'index.html';
            }, 3000);
        });

        document.getElementById('carte').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\s/g, '').replace(/\D/g, '');
            let formatted = value.match(/.{1,4}/g)?.join(' ') || '';
            e.target.value = formatted;
        });

        document.getElementById('expiration').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            e.target.value = value;
        });
    </script>
</body>
</html>
